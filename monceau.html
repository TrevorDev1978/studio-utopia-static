<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bleu de Hongrie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
    }

    .container {
      max-width: 1200px;
      margin: 80px auto;
      padding: 0 20px;
    }

    /* HEADER */
    #header {
      width: 100%;
      text-align: center;
      margin-top: 40px;
    }

    #logo img {
      display: block;
      margin: 0 auto;
      width: 325px;
      max-width: 325px;
    }

    #topNav {
      margin-top: 18px;
    }

    #topNav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #topNav li {
      display: inline-block;
      margin: 0 12px;
    }

    #topNav a {
      color: #575757;
      text-transform: uppercase;
      font-weight: 300;
      text-decoration: none;
      letter-spacing: 1px;
      font-size: 13px;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
    }

    #topNav a:hover {
      opacity: 0.7;
    }

    /* GALLERY */
    .gallery {
      margin-top: 60px;
    }

    .gallery .full img {
      width: 100%;
      display: block;
      margin-bottom: 64px;
    }

    .gallery .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      margin-bottom: 48px;
    }

    .img-box {
      height: 720px;
      overflow: hidden;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
    }

    /* ===== SLIDER IDENTIQUE BEAUGRENELLE ===== */
    .ba-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 48px;
      overflow: hidden;
      cursor: ew-resize;
      user-select: none;
    }

    .ba-after {
      display: block;
      width: 100%;
    }

    .ba-before {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      overflow: hidden;
    }

    .ba-before img {
      height: 100%;
      width: auto;
      max-width: none;
    }

    /* LIGNE */
    .ba-handle {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 100%;
      background: #fff;
      z-index: 10;
      cursor: ew-resize;
    }

    /* DISQUE CENTRAL (IMPORTANT) */
    .ba-handle::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* FLÈCHES */
    .ba-arrows {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      z-index: 11;
      pointer-events: none;
    }

    .ba-arrows svg {
      width: 28px;
      height: 28px;
      fill: #555;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .gallery .two-col {
        grid-template-columns: 1fr;
      }
      .img-box {
        height: auto;
      }
      .img-box img {
        height: auto;
      }
    }
  </style>
</head>

<body>

<header id="header">
  <div id="logo">
    <a href="index.html">
      <img src="images.squarespace-cdn.com/content/v1/578bbbc546c3c4caeeca2291/23d8f6a2-5cbf-4fdf-a7b8-54ed70ed6710/KBS_Logo_horizontalb469.png?format=1000w">
    </a>
  </div>

  <div id="topNav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="interieur.html">Intérieur</a></li>
      <li><a href="ephemere.html">Éphémère</a></li>
      <li><a href="rehabilitation.html">Réhabilitation/Construction</a></li>
      <li><a href="press.html">Press</a></li>
      <li><a href="studio.html">Studio</a></li>
      <li><a href="instagram.html">Instagram</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</header>

<div class="container">
  <div class="gallery">

    <div class="full">
      <img src="images/Monceau/monceau.png">
    </div>

    <!-- SLIDER -->
    <div class="ba-wrapper" id="ba1">
      <img class="ba-after" src="images/Monceau/apres1.jpg">
      <div class="ba-before" id="ba1-before">
        <img src="images/Monceau/avant1.jpg">
      </div>

      <div class="ba-handle" id="ba1-handle">
        <div class="ba-arrows">
          <svg viewBox="0 0 24 24">
            <path d="M8 5l-7 7 7 7V5zm8 0v14l7-7-7-7z"/>
          </svg>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
function initSlider(wrapperId, beforeId, handleId) {
  const wrapper = document.getElementById(wrapperId);
  const before  = document.getElementById(beforeId);
  const handle  = document.getElementById(handleId);
  let active = false;

  function setPosition(x) {
    const rect = wrapper.getBoundingClientRect();
    let pct = (x - rect.left) / rect.width;
    pct = Math.min(Math.max(pct, 0), 1);
    const pctStr = (pct * 100) + '%';
    before.style.width = pctStr;
    handle.style.left  = pctStr;
  }

  handle.addEventListener('mousedown', () => active = true);
  window.addEventListener('mouseup', () => active = false);
  window.addEventListener('mousemove', e => { if (active) setPosition(e.clientX); });

  handle.addEventListener('touchstart', e => { active = true; e.preventDefault(); }, { passive: false });
  window.addEventListener('touchend', () => active = false);
  window.addEventListener('touchmove', e => { if (active) setPosition(e.touches[0].clientX); });

  wrapper.addEventListener('click', e => setPosition(e.clientX));
}

initSlider('ba1', 'ba1-before', 'ba1-handle');
</script>

</body>
</html>

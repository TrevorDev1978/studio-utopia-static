  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
    }
    .container {
      max-width: 1200px;
      margin: 80px auto;
      padding: 0 20px;
    }

    /* ===== HEADER / LOGO / NAV ===== */
    #header {
      width: 100%;
      text-align: center;
      margin-top: 40px;
    }
    #logo {
      text-align: center;
    }
    #logo img {
      display: block;
      margin: 0 auto;
      width: 325px;
      height: auto;
      max-width: 325px;
    }
    #topNav {
      width: 100%;
      text-align: center;
      margin-top: 18px;
    }
    #topNav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #topNav li {
      display: inline-block;
      margin: 0 12px;
    }
    #topNav a {
      color: #575757;
      text-transform: uppercase;
      font-weight: 300;
      text-decoration: none;
      letter-spacing: 1px;
      font-size: 13px;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
      line-height: 1.6em;
    }
    #topNav a:hover {
      opacity: 0.7;
    }

    /* ===== INSTAGRAM GRID ===== */
    .instagram-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      margin-top: 40px;
    }

    .instagram-grid a {
      display: block;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }

    .instagram-grid a img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s ease;
    }

    .instagram-grid a:hover img {
      opacity: 0.85;
    }

    @media (max-width: 768px) {
      .instagram-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 480px) {
      .instagram-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

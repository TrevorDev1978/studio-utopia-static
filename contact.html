<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #FAFAF8;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
    }

    html {
      overflow-y: scroll;
    }

    /* ===== STRUCTURE ===== */
    #header {
      width: 100%;
      text-align: center;
      margin-top: 40px;
      margin-bottom: 0;
    }

    #logo {
      text-align: center;
      margin: 0;
      padding: 0;
    }

    #logo h1 {
      margin: 0;
      padding: 0;
      line-height: 1em;
    }

    #logo img {
      display: block;
      margin: 0 auto;
      width: 325px;
      height: auto;
      max-width: 325px;
    }

    #topNav {
      width: 100%;
      text-align: center;
      margin-top: 21px;
    }

    #topNav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #topNav li {
      display: inline-block;
      margin: 0 12px;
    }

    #topNav a {
      color: #575757;
      text-transform: uppercase;
      font-weight: 300;
      text-decoration: none;
      letter-spacing: 1px;
      font-size: 13px;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
      line-height: 1.6em;
    }

    #topNav a:hover {
      opacity: 0.7;
    }

    .page-divider {
      height: 1px;
      margin-top: 18px;
      background: transparent;
    }

    /* ===== CONTENU CONTACT ===== */
    #page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 30px 80px 30px;
    }

    .contact-wrapper {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 80px;
    }

    .contact-left h1 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 32px 0;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
    }

    /* ===== FORMULAIRE ===== */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .contact-form .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      box-sizing: border-box;
      border: none;
      border-bottom: 1px solid #aaa;
      padding: 8px 0;
      font-size: 13px;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
      color: #000;
      background: transparent;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-bottom-color: #000;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: #aaa;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .contact-form textarea {
      resize: none;
      height: 120px;
    }

    .contact-form button {
      align-self: flex-start;
      background: #000;
      color: #fff;
      border: none;
      padding: 10px 28px;
      font-size: 11px;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s ease;
    }

    .contact-form button:hover {
      opacity: 0.75;
    }

    /* ===== COORDONNÉES ===== */
    .contact-info h3 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 16px 0;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
    }

    .contact-info p {
      font-size: 13px;
      line-height: 1.8em;
      margin: 0 0 6px 0;
      color: #000;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
    }

    .contact-info a {
      color: #000;
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .contact-wrapper {
        grid-template-columns: 1fr;
        gap: 40px;
      }
      .contact-form .field-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<div id="canvas">

  <header id="header">
    <div id="logo">
      <h1 class="logo">
        <a href="index.html">
          <img src="../images.squarespace-cdn.com/content/v1/578bbbc546c3c4caeeca2291/23d8f6a2-5cbf-4fdf-a7b8-54ed70ed6710/KBS_Logo_horizontalb469.png?format=1000w" alt="kellybehun | STUDIO">
        </a>
      </h1>
    </div>

    <div id="topNav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="interieur.html">Intérieur</a></li>
        <li><a href="ephemere.html">Éphémère</a></li>
        <li><a href="rehabilitation.html">Réhabilitation/Construction</a></li>
        <li><a href="press.html">Presse</a></li>
        <li><a href="studio.html">Studio</a></li>
        <li><a href="instagram.html">Instagram</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </header>

  <div class="page-divider"></div>

  <section id="page">
    <div class="contact-wrapper">

      <div class="contact-left">
        <h1>Contactez-nous</h1>
        <form
          class="contact-form"
          action="https://formsubmit.co/contact@studio-utopia.com"
          method="POST"
        >
          <input type="hidden" name="_next" value="contact.html">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_subject" value="Nouveau message — Studio Utopia">

          <div class="field-row">
            <input type="text" name="prenom" placeholder="Prénom" required>
            <input type="text" name="nom" placeholder="Nom" required>
          </div>

          <input type="email" name="email" placeholder="Adresse e-mail" required>
          <input type="text" name="sujet" placeholder="Sujet" required>
          <textarea name="message" placeholder="Message" required></textarea>

          <button type="submit">Envoyer</button>
        </form>
      </div>

      <div class="contact-info">
        <h3>Studio Utopia</h3>
        <p><a href="tel:+33637877149">+33 6 37 87 71 49</a></p>
        <p><a href="mailto:contact@studio-utopia.com">contact@studio-utopia.com</a></p>
      </div>

    </div>
  </section>

</div>
</body>
</html>

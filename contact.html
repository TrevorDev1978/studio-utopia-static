<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #FAFAF8;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
    }

    html { overflow-y: scroll; }

    #header {
      width: 100%;
      text-align: center;
      margin-top: 40px;
    }

    #logo img {
      display: block;
      margin: 0 auto;
      width: 325px;
      max-width: 325px;
    }

    #topNav {
      text-align: center;
      margin-top: 21px;
    }

    #topNav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #topNav li {
      display: inline-block;
      margin: 0 12px;
    }

    #topNav a {
      color: #575757;
      text-transform: uppercase;
      font-weight: 300;
      text-decoration: none;
      letter-spacing: 1px;
      font-size: 13px;
    }

    #topNav a:hover { opacity: 0.7; }

    #page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 30px 80px;
    }

    .contact-wrapper {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 80px;
    }

    .contact-left h1 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    input, textarea {
      border: none;
      border-bottom: 1px solid #aaa;
      padding: 8px 0;
      font-size: 13px;
      background: transparent;
      outline: none;
    }

    input:focus, textarea:focus {
      border-bottom-color: #000;
    }

    textarea {
      height: 120px;
      resize: none;
    }

    button {
      background: #000;
      color: #fff;
      border: none;
      padding: 10px 28px;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover { opacity: 0.75; }

    .contact-info h3 {
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .contact-info p {
      font-size: 13px;
      margin: 0 0 6px;
    }

    @media (max-width: 768px) {
      .contact-wrapper {
        grid-template-columns: 1fr;
        gap: 40px;
      }
      .field-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header id="header">
  <div id="logo">
    <a href="index.html">
      <img src="../images.squarespace-cdn.com/content/v1/578bbbc4/KBS_Logo.png">
    </a>
  </div>

  <div id="topNav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="interieur.html">Intérieur</a></li>
      <li><a href="ephemere.html">Éphémère</a></li>
      <li><a href="rehabilitation.html">Réhabilitation</a></li>
      <li><a href="press.html">Presse</a></li>
      <li><a href="studio.html">Studio</a></li>
      <li><a href="instagram.html">Instagram</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</header>

<section id="page">
  <div class="contact-wrapper">

    <div class="contact-left">
      <h1>Contactez-nous</h1>

      <!-- ✅ FORM FIXATO -->
      <form class="contact-form" id="contactForm">

        <div class="field-row">
          <input type="text" name="prenom" placeholder="Prénom" required>
          <input type="text" name="nom" placeholder="Nom" required>
        </div>

        <input type="email" name="email" placeholder="Adresse e-mail" required>
        <input type="text" name="sujet" placeholder="Sujet" required>
        <textarea name="message" placeholder="Message" required></textarea>

        <button type="submit">Envoyer</button>
      </form>
    </div>

    <div class="contact-info">
      <h3>Studio Utopia</h3>
      <p><a href="tel:+33637877149">+33 6 37 87 71 49</a></p>
      <p><a href="mailto:contact@studio-utopia.fr">contact@studio-utopia.fr</a></p>
    </div>

  </div>
</section>

<!-- ✅ SCRIPT INVIO -->
<script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = Object.fromEntries(new FormData(this));

  const res = await fetch("/api/contact", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  if (res.ok) {
    alert("Message envoyé ✔");
    this.reset();
  } else {
    alert("Erreur ❌");
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Interiors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Atelier Utopia interiors and architecture projects.">

  <style>
    html {
      overflow-y: scroll;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #FAFAF8;
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
    }

    #header {
      width: 100%;
      text-align: center;
      margin-top: 40px;
      margin-bottom: 0;
    }

    #logo {
      text-align: center;
      margin: 0;
      padding: 0;
    }

    #logo a {
      display: inline-block;
      margin: 0;
      padding: 0;
    }

    #logo img {
      display: block;
      margin: 0 auto;
      width: 325px;
      height: auto;
      max-width: 325px;
    }

    #topNav {
      width: 100%;
      text-align: center;
      margin-top: 18px;
      margin-bottom: 0;
      padding: 0;
    }

    #topNav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #topNav li {
      display: inline-block;
      margin: 0 12px;
    }

    #topNav a {
      color: #575757;
      text-transform: uppercase;
      font-weight: 300;
      text-decoration: none;
      letter-spacing: 1px;
      font-size: 13px;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
      line-height: 1.6em;
    }

    #topNav a:hover {
      opacity: 0.7;
    }

    .container {
      max-width: 1200px;
      margin: 60px auto 0 auto;
      padding: 0 30px 80px 30px;
      box-sizing: border-box;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 42px 28px;
      align-items: start;
    }

    .project-card {
      display: block;
      text-decoration: none;
      color: inherit;
      position: relative;
    }

    .project-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f1f1ed;
      position: relative;
    }

    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    .project-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.26);
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .project-overlay span {
      color: #fff;
      font-size: 13px;
      line-height: 1.4;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      font-family: futura-pt, Arial, Helvetica, sans-serif;
      font-weight: 300;
    }

    .project-card:hover .project-overlay {
      opacity: 1;
    }

    .project-card:hover .project-image img {
      transform: scale(1.02);
    }

    .project-title {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      color: #575757;
      text-transform: none;
      letter-spacing: 0.3px;
      text-align: left;
    }

    @media (max-width: 980px) {
      .projects-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      #logo img {
        width: 260px;
        max-width: 80vw;
      }

      #topNav li {
        margin: 0 8px;
      }

      .container {
        margin-top: 40px;
        padding: 0 18px 60px 18px;
      }

      .projects-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }
    }
  </style>
</head>

<body>

<header id="header">
  <div id="logo">
    <a href="index.html">

    </a>
  </div>

  <div id="topNav">
    <ul>

      <li><a href="ephemere.html">Éphémère</a></li>

      <li><a href="press.html">Presse</a></li>

      <li><a href="instagram.html">Instagram</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</header>

<div class="container">

    </a>

    <a class="project-card" href="/aurea.html" onclick="window.location.href=this.href; return false;">

    </a>

    <a class="project-card" href="/lemaitre-rigoles.html" onclick="window.location.href=this.href; return false;">

</html>
